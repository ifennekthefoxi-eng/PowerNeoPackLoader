plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = project.mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroup("software.bernie.geckolib")
        }
    }
}

dependencies {
    // GeckoLib Implementation
    implementation "software.bernie.geckolib:geckolib-neoforge-${project.minecraft_version}:${project.geckolib_version}"
}

configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

def generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    def replaceProperties = [
            minecraft_version      : project.minecraft_version,
            minecraft_version_range: project.minecraft_version_range,
            neo_version            : project.neo_version,
            loader_version_range   : project.loader_version_range,
            mod_id                 : project.mod_id,
            mod_name               : project.mod_name,
            mod_license            : project.mod_license,
            mod_version            : project.mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    // FIXED: Properly attach the task provider inside the DSL
    ideSyncTask(generateModMetadata)
}

// Published so other mods can compile against this library. `./gradlew publish` writes to
// PowerNeoPackLoader/repo/, which a consuming mod adds as a maven repository - see the README.
java {
    // Sources travel with the artifact: this library is meant to be read while it's being used
    // (the annotations and PackBlockContext carry their contract in their javadoc), and without
    // this a consumer's IDE shows them as bare signatures.
    withSourcesJar()
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            // Explicit, because the default is the Gradle project NAME - the directory the repo
            // happens to be checked out into ("PowerNeoPackLoader"), which is both case-sensitive
            // in a maven coordinate and not something this build controls. Pinning it to mod_id
            // keeps the coordinate stable and matching the jar's own name.
            artifactId = project.mod_id
            from components.java
        }
    }
    repositories {
        maven {
            name = 'localRepo'
            // A resolved URI, not an interpolated "file://${projectDir}" string: the string form
            // holds a live reference to the Project, which Gradle's configuration cache (enabled
            // in gradle.properties) cannot serialize - it fails the whole build before publishing
            // with "error writing value of type RepositorySpec$Configured".
            url = layout.projectDirectory.dir('repo').asFile.toURI()
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}